    title: Deploy the wishlist enrichment and backfill
    status: done
    capability: human
    environment: [atlas]
    depends_on: [WISH-001]
    scope: [spec/evidence/DEPLOY-006.md]
    outcome: Bobby confirms, then rsync and deploy.sh put the wired wishlist enrichment on Atlas and a Full sync is run to backfill. The backfill is the sync itself, not a hand-run statement: the first run processes all 396 needs_review entries at 250ms each (~100s) and stamps each one. Record the before and after counts for entries with artwork and with an igdb_id, and the run's sync_log row.
    acceptance: ["curl -s -o /dev/null -w '%{http_code}' http://192.168.3.174:8090/", "grep -q 'before' spec/evidence/DEPLOY-006.md", "grep -q 'after' spec/evidence/DEPLOY-006.md"]

