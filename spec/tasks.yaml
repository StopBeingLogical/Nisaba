    acceptance: ["curl -s -o /dev/null -w '%{http_code}' http://192.168.3.174:8090/"]

  - id: GOGL-006
    title: Stop the Playnite script sending GOG games
    status: done
    capability: bounded-coder
    environment: [local]
    depends_on: [DEPLOY-004]
    scope: [templates/sync.html]
    outcome: The embedded Playnite script skips entries whose source is gog, so GOG has one writer, and the card copy no longer claims Playnite replaces the GOG sync. Bobby's ruling, 2026-09-16 ("no need for playnite sync, at least for GOG").
    acceptance: ["go build ./...", "go test ./...", "grep -q 'GOG is synced by the server' templates/sync.html"]

