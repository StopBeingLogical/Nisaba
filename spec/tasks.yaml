  # ── Round 2026-09-17 (data cleanup) — rulings in spec/PRODUCT-5.md ──────

  - id: DATA-001
    title: Correct the multiple-stores indicator
    status: done
    capability: bounded-coder
    environment: [local]
    depends_on: [AUDIT-001]
    scope: [db/store.go, db/models.go, spec/evidence/DATA-001.md]
    outcome: multi_store_owned answers whether the game is owned on more than one store, not whether another game row shares its igdb_id. Measured 2026-09-17 (AUDIT-001): the sibling-row test flags 796 games where 102 are genuinely on 2+ stores — 786 false positives and 92 false negatives. Count owned game_stores links instead; idx_game_stores_game_id_owned serves it as a covering index. Correct the field comment in db/models.go:55, which describes the old semantics. This must be deployed before DATA-002 removes the duplicate rows, because those rows are what the old query was counting.
    acceptance: ["go build ./...", "go vet ./...", "go test ./...", "! grep -q 'g2.id != g.id' db/store.go"]

