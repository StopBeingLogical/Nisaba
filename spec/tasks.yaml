    status: blocked
    capability: human
    environment: [atlas]
    depends_on: [DEPLOY-007]
    scope: [spec/evidence/DATA-002.md]
    outcome: One row survives per identity (igdb_id where set, else exact title), preferring a row that holds owned store links and then the earliest; the doomed rows' 266 store links, 1865 genres and 49 content rows are moved onto it, with the 68 rows holding playtime and 67 holding last_played. Then the surplus 718 rows are deleted. By hand, in one transaction, with backups, foreign keys on, and before/after counts recorded; migrations are additive only so this cannot be a migration. No user-authored field (favourite, rating, notes, play_status, is_installed) is set on any doomed row, and no wishlist entry or parent_id points at one.
