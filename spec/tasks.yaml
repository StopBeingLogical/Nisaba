  # ── Round 2026-09-17 (wishlist) — ruling in spec/PRODUCT-4.md ─────────────

  - id: WISH-001
    title: Enrich wishlist entries in the full sync
    status: done
    capability: bounded-coder
    environment: [local]
    depends_on: [DEPLOY-005]
    scope: [handlers/sync.go, spec/evidence/WISH-001.md]
    outcome: The Full sync's enrichment step runs EnrichWishlist alongside EnrichLibrary, so a wishlist entry the Steam sync adds stops arriving as needs_review with no igdb_id and no artwork. Measured 2026-09-17 (spec/PRODUCT-4.md): EnrichWishlist has no caller at all — its only call sites were routes deleted by commit 9557160 — and SyncAll has never called it, so this is new behaviour rather than a regression. Do not change bestMatch, the 250ms tick, or ListWishlistNeedsEnrichment, and do not touch cleanupWishlistLinks or any linking behaviour.
    acceptance: ["go build ./...", "go vet ./...", "go test ./...", "grep -q 'EnrichWishlist' handlers/sync.go"]

